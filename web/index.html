<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orthogonal Fourier Epicycles — World Atlas Edition</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
  <div class="app-container">
    <!-- Left Country Selector Panel -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1 class="brand-title">Fourier Atlas</h1>
        <p class="brand-subtitle">Orthogonal Epicycles</p>
      </div>

      <div class="search-box-container">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search country or code..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>

      <div class="continent-chips">
        <button class="chip-btn active" data-continent="All">All</button>
        <button class="chip-btn" data-continent="Asia">Asia</button>
        <button class="chip-btn" data-continent="Europe">Europe</button>
        <button class="chip-btn" data-continent="Africa">Africa</button>
        <button class="chip-btn" data-continent="North America">N. America</button>
        <button class="chip-btn" data-continent="South America">S. America</button>
        <button class="chip-btn" data-continent="Oceania">Oceania</button>
        <button class="chip-btn" data-continent="Continents">Continents</button>
        <button class="chip-btn" data-continent="World">World</button>
      </div>

      <div class="map-list" id="mapListContainer">
        <!-- Rendered dynamically -->
      </div>
    </aside>

    <!-- Main Visualizer Area -->
    <main class="main-stage">
      <!-- Top HUD Bar -->
      <header class="hud-bar">
        <div class="hud-left">
          <span class="current-map-title" id="hudMapTitle">India</span>
          <div class="hud-badges">
            <span class="metric-pill teal" id="hudN">N = 120</span>
            <span class="metric-pill coral" id="hudError">error = 0.05%</span>
            <span class="metric-pill gold" id="hudRingStatus" style="display: none;">Part 1 of 1</span>
          </div>
        </div>

        <div class="math-hud-container">
          <div class="equation-item" id="hudEqX"></div>
          <div class="equation-item" id="hudEqY"></div>
          <div class="equation-item" id="hudEqP"></div>
        </div>
      </header>

      <!-- Canvas Viewport -->
      <div class="viewport-container" id="canvasContainer">
        <canvas id="epicycleCanvas"></canvas>
      </div>

      <!-- Bottom Controls Dock -->
      <footer class="controls-dock">
        <!-- Top controls row: Sliders, Play/Pause, Random, Actions -->
        <div class="controls-row">
          <div class="control-group">
            <button class="btn btn-primary" id="btnPlayPause">⏸ Pause</button>
            <button class="btn btn-secondary" id="btnReset" title="Clear drawn path (C)">↺ Reset</button>
            <button class="btn btn-secondary" id="btnRandom" title="Pick random country (R)">🎲 Random</button>
          </div>

          <div class="control-group">
            <span class="control-label">Harmonics (N):</span>
            <button class="btn btn-secondary btn-icon" id="btnNMinus" title="Decrease N (-)">-10</button>
            <div class="slider-container">
              <input type="range" id="sliderN" min="1" max="500" value="120" step="1" />
              <span class="slider-val" id="valN">120</span>
            </div>
            <button class="btn btn-secondary btn-icon" id="btnNPlus" title="Increase N (+)">+10</button>
          </div>

          <div class="control-group">
            <span class="control-label">Speed:</span>
            <div class="slider-container">
              <input type="range" id="sliderSpeed" min="0.1" max="4.0" value="1.0" step="0.1" />
              <span class="slider-val" id="valSpeed">1.0x</span>
            </div>
          </div>

          <div class="control-group">
            <span class="control-label">Detail:</span>
            <select class="select-input" id="selectDetail">
              <option value="all" selected>All rings</option>
              <option value="large">Main + large islands</option>
              <option value="main">Main landmass only</option>
            </select>
          </div>

          <div class="control-group">
            <button class="btn btn-secondary" id="btnLeaderboard" title="View Shape Complexity (L)">🏆 Leaderboard</button>
            <button class="btn btn-secondary btn-icon" id="btnTheme" title="Toggle Theme (T)">🌓</button>
          </div>
        </div>

        <!-- Bottom controls row: Toggles & Exports -->
        <div class="controls-row">
          <div class="control-group">
            <label class="toggle-item">
              <input type="checkbox" id="toggleCircles" checked />
              <span>Epicycles</span>
            </label>
            <label class="toggle-item">
              <input type="checkbox" id="toggleProjections" checked />
              <span>Dashed Guides</span>
            </label>
            <label class="toggle-item">
              <input type="checkbox" id="toggleLanczos" />
              <span>Lanczos Smoothing</span>
            </label>
            <label class="toggle-item">
              <input type="checkbox" id="toggleSilhouette" />
              <span>Silhouette</span>
            </label>
            <label class="toggle-item">
              <input type="checkbox" id="toggleGroundTruth" />
              <span>Ground Truth</span>
            </label>
            <label class="toggle-item">
              <input type="checkbox" id="toggleAutoSweep" />
              <span>Auto N-Sweep</span>
            </label>
          </div>

          <div class="control-group">
            <button class="btn btn-secondary" id="btnExportPNG" title="Download Canvas PNG">📸 Screenshot</button>
            <button class="btn btn-secondary" id="btnRecordWebM" title="Record WebM Video">⏺ Record WebM</button>
            <button class="btn btn-secondary" id="btnExportJSON" title="Download Fourier JSON">📄 JSON</button>
            <button class="btn btn-secondary" id="btnExportCSV" title="Download Harmonics CSV">📊 CSV</button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
